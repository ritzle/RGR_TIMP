services:
  storage-server:
    build:
      context: ./storage-server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./storage-server/storage:/app/storage
    restart: unless-stopped

  ssh-server:
    build:
      context: ./ssh-server
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    restart: unless-stopped